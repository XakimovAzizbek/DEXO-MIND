<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Yaratish</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🧠</span>
                <span class="logo-text">AI Model Yaratish</span>
            </div>
        </header>

        <main class="content">
            <div class="panel">
                <h2>1. Ma'lumot kiriting</h2>
                <p>Suhbat matnlarini kiriting. Har bir gap yangi qatorda bo'lsin.</p>
                <textarea id="train-text" rows="12">Salom
Salom, qalaysan?
Isming nima?
Mening ismim AI.
Sen kim yaratgan?
Meni o'zimning egam yaratdi.
Qalaysan?
Rahmat, yaxshi. O'zing-chi?
Yaxshi, rahmat.
Nima qilyapsan?
Hech narsa, sen bilan gaplashyapman.
Yaxshi.
Xo'p.
Salom, do'stim.
Salom, qalaysan, do'stim?
Yaxshi, rahmat, o'zing-chi?
Yaxshi.</textarea>
                
                <div class="controls">
                    <button id="train-btn" class="btn-primary">Modelni Yaratish</button>
                    <button id="export-btn" class="btn-success" disabled>Saqlash (.json)</button>
                </div>
                <div id="loss-display" class="loss">Tayyor...</div>
            </div>
        </main>
    </div>
    <script src="index.js"></script>
</body>
</html>
